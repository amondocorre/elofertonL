    <script>
      // Detectar fallos al cargar nuevos módulos de JavaScript (muy común tras redesplegar en Dokploy)
      window.addEventListener('error', (e) => {
        if (e.message && (
          e.message.includes('Failed to fetch dynamically imported module') || 
          e.message.includes('Importing a module script failed')
        )) {
          console.warn("Nueva versión detectada en el servidor. Recargando aplicación...");
          window.location.reload();
        }
      }, true);
    </script>
